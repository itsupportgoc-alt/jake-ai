[workspace]
resolver = "2"
members = [
    "core/rust/crates/Jake-protocol",
    "core/rust/crates/Jake-core",
    "core/rust/crates/Jake-cli",
    "core/rust/crates/Jake-ai",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://example.invalid/Jake"

[workspace.dependencies]
Jake-protocol = { path = "core/rust/crates/Jake-protocol" }
Jake-core = { path = "core/rust/crates/Jake-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "io-std", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
clap = { version = "4", features = ["derive"] }
toml = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true